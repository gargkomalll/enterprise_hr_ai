services:
  - type: web
    name: enterprise-hr-ai-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: COST_MULTIPLIER
        value: "1.5"
      - key: PORT
        value: "10000"
