version: '3.8'

services:
  backend:
    build: .
    container_name: enterprise_hr_backend
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=models/attrition_pipeline.joblib
      - DATA_MASTER_PATH=data/processed/employee_intelligence_master.csv
      - FEATURES_PATH=data/processed/features_engineered.csv
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build: .
    container_name: enterprise_hr_frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./data:/app/data
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0
